    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "none, noarchive, noimageindex, nosnippet, notranslate" always;
    #add_header X-XSS-Protection          "1; mode=block" always;    # deprecated (browsers dropped the XSS auditor); CSP covers it
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self' https://gloat.ing https://www.gloat.ing; media-src 'self' https://gloat.ing https://www.gloat.ing https://media.gloat.ing; worker-src 'self' https://gloat.ing https://www.gloat.ing blob:; script-src 'self' https://gloat.ing https://www.gloat.ing https://widgets.tradingview-widget.com; style-src 'self' https://gloat.ing https://www.gloat.ing; img-src 'self' https://gloat.ing https://s3-symbol-logo.tradingview.com; font-src 'self' https://gloat.ing; connect-src 'self' wss://gloat.ing/webirc https://media.gloat.ing https://raw.githubusercontent.com https://api.github.com; frame-src 'self' https://gloat.ing https://www.gloat.ing https://widgets.tradingview-widget.com; frame-ancestors 'self' https://gloat.ing https://www.gloat.ing; form-action 'self' https://gloat.ing https://www.gloat.ing" always;
    #add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), clipboard-read=(self), clipboard-write=(self), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Alt-Svc 'h3=":443"; ma=2592000, h2=":443"; ma=86400' always;
    #add_header Alt-Svc 'h3=":443"; ma=2592000,h3-29=":443"; ma=2592000';
    #add_header Alt-Svc 'h3=":443"; ma=2592000; persist=1' always;
    add_header X-protocol $server_protocol always;

    # Hide some standard response headers:
     proxy_hide_header X-Powered-By;
     proxy_hide_header X-AspNetMvc-Version;
     proxy_hide_header X-AspNet-Version;
     proxy_hide_header X-Drupal-Cache;

    # Hide some Amazon S3 specific response headers:
     proxy_hide_header X-Amz-Id-2;
     proxy_hide_header X-Amz-Request-Id;
    # Hide other risky response headers:
     proxy_hide_header X-Runtime;

    # Remove risky request headers (the safest method):
    # Disabled: never applied. /webirc (the only proxy_pass) sets its own proxy_set_header,
    # and any proxy_set_header in a location drops all of the inherited http-level ones.
    # proxy_set_header X-Original-URL "";
    # proxy_set_header X-Rewrite-URL "";
    # proxy_set_header X-Forwarded-Server "";
    # proxy_set_header X-Forwarded-Host "";
    # proxy_set_header X-Host "";