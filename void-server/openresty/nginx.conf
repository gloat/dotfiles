load_module /usr/local/openresty/nginx/modules/ngx_http_geoip2_module.so;
load_module /usr/local/openresty/nginx/modules/ngx_http_naxsi_module.so;

user  nginx;
worker_processes  1;
worker_rlimit_nofile 100000;
pcre_jit on;    # JIT-compile regexes (bots.conf map, regex locations); built --with-pcre-jit
#pid        logs/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    include /usr/local/openresty/nginx/conf/headers.conf;
    include /usr/local/openresty/nginx/conf/naxsi_core.rules;
    include /usr/local/openresty/nginx/conf/bots.conf;
    lua_package_path "/usr/local/openresty/nginx/conf/lua/?.lua;;";

    limit_req_zone $binary_remote_addr zone=site:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=irc:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=stall:1m rate=6r/m;
    # stall reports from the video player (js/void-bitrate.js): no IP, just what stalled where
    log_format stall escape=none '$time_iso8601\t$stall_line';
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Browser cache time per response type (static files only, see `expires` in location / and /irc).
    # html/css/js: no-cache = revalidate every load (cheap 304s), since the names aren't versioned.
    map $sent_http_content_type $cache_expires {
        default             off;
        ~^text/html         epoch;
        ~^text/css          epoch;
        ~javascript         epoch;
        ~^font/             30d;
        ~^image/            7d;
        ~^(audio|video)/    7d;
    }

    include cloudflare-realip.conf;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay		on;

    #client_body_buffer_size 16k; and proxy buffer was 16k
    #client_body_buffer_size 0;
    #proxy_buffer_size 0;
    #proxy_buffers 4 16k;
    keepalive_timeout  65;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256";
    #ssl_ecdh_curve X25519:secp521r1:secp384r1:prime256v1;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_early_data on;
    #ssl_conf_command Options KTLS;
    #ssl_certificate      /etc/nginx/cert/gloat_ing_chain.crt;
    #ssl_certificate_key  /etc/nginx/cert/gloat.ing.key;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    # Old format (missing spaces, $remote_addr twice), kept for reference:
    #log_format upstream_time '$remote_addr $remote_user [$time_local]'
    #                         '"$request" $status $body_bytes_sent'
    #                         '"$http_referer" "$http_user_agent" $host '
    #                         'rt="$request_time" quic="$http3" $remote_addr'
    #                         'city=$geoip2_city cc=$geoip2_country_code lat=$geoip2_latitude lon=$geoip2_longitude'
    #                         '[AS$geoip2_asn $geoip2_asname]';
    # fail2ban's nginx-badstuff filter depends on: IP first, then '"REQUEST" STATUS'.
    log_format upstream_time '$remote_addr $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" $host '
                             'rt="$request_time" quic="$http3" '
                             'city="$geoip2_city" cc=$geoip2_country_code lat=$geoip2_latitude lon=$geoip2_longitude '
                             '[AS$geoip2_asn $geoip2_asname]';

    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
     auto_reload 60m;
     $geoip2_country_code default=XX country iso_code;
     $geoip2_country_name country names en;}

    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
     auto_reload 60m;
     $geoip2_city      city names en;
     $geoip2_latitude  location latitude;
     $geoip2_longitude location longitude;}

     geoip2 /usr/share/GeoIP/GeoLite2-ASN.mmdb {
      auto_reload 60m;
      $geoip2_asn autonomous_system_number;
      $geoip2_asname autonomous_system_organization;}

     resolver 1.1.1.1 9.9.9.9 valid=300s;
     resolver_timeout 5s;

    # 0 for blocked user agents (bots.conf), so they stay out of the access log
    map $block_ua $log_ua {
        1       0;
        default 1;
    }

   # Port 80: unknown hosts / bare-IP scans get dropped, gloat.ing is redirected to https
   server {
           listen 80 default_server;
           listen [::]:80 default_server;
           server_name _;
           access_log off;
           return 444;}

   server {
           listen 80;
           listen [::]:80;
           server_name gloat.ing www.gloat.ing;
           access_log off;
           return 301 https://$host$request_uri;}

   server {
           listen 443 ssl;
           listen [::]:443 ssl;
           server_name _;
           log_not_found off;
           access_log off;
           #access_log /var/log/nginx/default-access.log upstream_time;
           #error_log /var/log/nginx/default-error.log warn;
           error_page 400 404 405 =444 /444.html;
           location = /444.html {return 444;}
           ssl_reject_handshake on;    # unknown SNI / bare IP: the TLS handshake is refused, so no cert is needed
           #ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
           #ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
           limit_req zone=login burst=1 nodelay;
           limit_req_status 444; #
           return 444;}

   server {
           http2 on;
           listen 443 ssl;
           listen [::]:443 ssl;
           listen 443 quic;
           listen [::]:443 quic;

           #using cloudflare atm; uncomment if we drop the proxy
           #quic_retry on;
           #quic_gso on;
           #quic_bpf on;

           # OCSP stapling
           #ssl_trusted_certificate /usr/local/openresty/nginx/conf/cert/gloat_ing.ca-bundle;
           #ssl_stapling on;
           #ssl_stapling_verify on;
           resolver 1.1.1.1 9.9.9.9 valid=300s;
           resolver_timeout 5s;

           server_name gloat.ing www.gloat.ing;
           #access_log /var/log/openresty/access.log upstream_time;
           access_log /var/log/openresty/access.log upstream_time if=$log_ua;
           access_log /var/log/openresty/blocked.log upstream_time if=$block_ua;
           error_log /var/log/openresty/error.log warn;
           root /usr/local/openresty/nginx/html;    # was set in location / and /void/ (and /irc used an alias)

           # Blocked user agents (bots.conf) for every location (was only checked in location /)
           if ($block_ua) {
               return 444;
           }
           limit_conn conn_limit_per_ip 40;
           limit_req zone=site burst=40 nodelay;
           limit_req_status 429;
           limit_conn_status 429;
           reset_timedout_connection on;
           ssl_certificate      /usr/local/openresty/nginx/conf/cert/lego/gloat.ing.crt;
           ssl_certificate_key  /usr/local/openresty/nginx/conf/cert/lego/gloat.ing.key;
           #ssl_certificate      /etc/nginx/cert/gloat_ing_chain.crt;     ssl.com from namecheap
           #ssl_certificate_key  /etc/nginx/cert/gloat.ing.key;

           error_page 404 500 502 503 504 =444 /444.html;
           location = /444.html {
           return 444;}

           #foce dark-mode site wide
          # sub_filter '<head>' '<head><meta name="color-scheme" content="dark">';
          # sub_filter_once on;
          # sub_filter_types text/html;

           location /irc {
           	#alias /usr/share/nginx/html/irc;    # same path as server root + /irc
            limit_req zone=irc burst=200 nodelay;
            index index.html;
           	#auth_basic "Restricted Area";
           	#auth_basic_user_file /etc/nginx/.htpasswd;
           	expires $cache_expires;
           }

           location /webirc {
             proxy_pass http://127.0.0.1:8067;
             proxy_http_version 1.1;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection "Upgrade";
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header Origin $http_origin;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_read_timeout 600s;
             #proxy_set_header X-Forwarded-For $remote_addr;
             #proxy_set_header X-Debug "1";
             #proxy_set_header X-Real-IP $remote_addr;
             #proxy_set_header User-Agent $http_user_agent;
             }


           location /ip {
             default_type text/plain;
             return 200 "remote_addr: $remote_addr\nrealip_remote_addr: $realip_remote_addr\nXFF: $http_x_forwarded_for\n";
             }

           location = /status {
             satisfy any;
             auth_basic "Restricted Area";
             auth_basic_user_file /usr/local/openresty/nginx/conf/.htpasswd;
             access_by_lua_block {
               local auth = require "void_auth"
               if not auth.check() then
               ngx.redirect("/void/login")
             end }
             stub_status;
             }

           location = /dashboard {
           satisfy any;
              auth_basic "Restricted Area";
              auth_basic_user_file /usr/local/openresty/nginx/conf/.htpasswd;
            access_by_lua_block {
               local auth = require "void_auth"
               if not auth.check() then
               ngx.redirect("/void/login")
            end }
            content_by_lua_block {
               local dashboard = require "dashboard"
               ngx.header["Content-Type"] = "text/html; charset=utf-8"
               ngx.say(dashboard.render())}}

           #location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
           # No auth_basic directive here
           #expires 30d;
           #auth_basic off;
           #add_header Cache-Control "public, no-transform";}

			# Block all dotfiles (covers .env, .git, .htaccess, .htpasswd, .DS_Store, etc.)
			location ~* /\.(?!well-known) {
			    deny all;
			    log_not_found off;
			    access_log off;
			    return 444;
			}

			location ~* wp-login {
			    deny all;
			    log_not_found off;
			    access_log off;
			    return 404;
			}

			# Block backup/temp/dump files
			location ~* \.(bak|old|tmp|sql|log|env|git|bin|php|bash|exe|swp|swo|key|pem|conf|cfg|yaml|yml|sh|ini|dist)$ {
			    deny all;
			    log_not_found off;
			    access_log off;
			    return 444;
			}

			# Block editor temp files (files ending in ~)
			location ~ ~$ {
			    deny all;
			    log_not_found off;
			    access_log off;
			    return 444;
			}

			# Block common project files
			location ~* (CLAUDE\.md|README\.md|CHANGELOG\.md|composer\.(json|lock)|package(-lock)?\.json) {
			    deny all;
			    log_not_found off;
			    access_log off;
			    return 444;
			}
			# <redacted:sandbox>
			# <redacted:sandbox>

			location ~* .(display_errors|set_time_limit|allow_url_include.*disable_functions.*open_basedir|set_magic_quotes_runtime|webconfig.txt.php|file_put_contentssever_root|wlwmanifest) {
			 log_not_found off;
			 access_log off;
			return 444;}
           location ~* .(globals|encode|localhost|loopback|xmlrpc|revslider|roundcube|webdav|smtp|http\:|soap|w00tw00t) {
			log_not_found off;
			access_log off;
           return 444;}


           location / {
           expires $cache_expires;
               #root   /usr/share/nginx/html;    # set at server level
               # --- NAXSI directives go INSIDE the location block ---
                    SecRulesEnabled;
                    LearningMode;              # ← "detect mode" (logs, doesn't block)
                    LibInjectionSql;           # optional: libinjection SQLi detection
                    LibInjectionXss;           # optional: libinjection XSS detection

                    DeniedUrl "/RequestDenied";

                    CheckRule "$SQL >= 8" BLOCK;
                    CheckRule "$XSS >= 8" BLOCK;
                    CheckRule "$RFI >= 8" BLOCK;
                    CheckRule "$TRAVERSAL >= 5" BLOCK;
                    CheckRule "$EVADE >= 4" BLOCK;
                    CheckRule "$UPLOAD >= 5" BLOCK;

                    # Whitelists
                    BasicRule wl:17 "mz:$HEADERS_VAR:signature-input";
                    BasicRule wl:17 "mz:$HEADERS_VAR:accept";
                    # [ ] in media file names (yt-dlp style "Title [videoID].webm"), URL path only
                    BasicRule wl:1310,1311 "mz:$URL_X:\.(webm|mp4|avi|mkv|m4a|mp3|opus|flac)$|URL";

                    # bot check moved to the server level
                    #if ($block_ua) {
                    #      return 444;
                    #      access_log off;
                    #  }
                    limit_except GET {
                    				   access_log off;
                    				   deny all;
                               }
               #try_files $uri $uri/ =404;}
               index  index.html;}

               location /RequestDenied {
                           internal;
                           return 403;
                           error_log /var/log/openresty/naxsi.log warn;
                       }

           location /void/ {
             more_set_headers "Cache-Control: private";   # never cache behind the login at Cloudflare
             satisfy any;
             auth_basic "Restricted Area";
             auth_basic_user_file /usr/local/openresty/nginx/conf/.htpasswd;
             access_by_lua_block {
               local auth = require "void_auth"
               if not auth.check() then
                 ngx.redirect("/void/login")
               end
               }
            fancyindex off;
            fancyindex_localtime on;
            fancyindex_exact_size off;
            fancyindex_header "/Nginx-Fancyindex/header.html";
            fancyindex_footer "/Nginx-Fancyindex/footer.html";
            fancyindex_ignore "HEADER.md";
            fancyindex_ignore "FOOTER.md";
            fancyindex_ignore "Nginx-Fancyindex";
            #root /usr/share/nginx/html;    # set at server level
            limit_req zone=site burst=40 nodelay;
            limit_req_status 429;}

           # bbx moved to R2 (2026-10-08): old /void/bbx/ links go to the media Worker, which does its own login check.
           # ^~ = this prefix wins over /void/ and skips the regex locations above.
           # $request_uri is the raw, still percent-encoded path (+ query string): a location capture or $uri
           # would be decoded, and file names with spaces/[brackets] would end up broken in the Location header.
           location = /void/bbx { return 301 https://media.gloat.ing/bbx/; }
           location ^~ /void/bbx/ {
               # the 4 MKVs became .mp4 on R2
               if ($request_uri ~ ^/void/bbx/(.*)\.mkv$) {
                   return 301 https://media.gloat.ing/bbx/$1.mp4;
               }
               if ($request_uri ~ ^/void/bbx/(.*)$) {
                   return 301 https://media.gloat.ing/bbx/$1;
               }
           }
           location ^~ /void/q3/ { return 301 https://media.gloat.ing/q3/; }
           location = /void/q3 { return 301 https://media.gloat.ing/q3/; }

           # 2026-10-09: the rest of /void/ moved to R2 (same names; df → q3/df with .mkv → .mp4)
           location ^~ /void/df/ {
               if ($request_uri ~ ^/void/df/(.*)\.mkv$) { return 301 https://media.gloat.ing/q3/df/$1.mp4; }
               if ($request_uri ~ ^/void/df/(.*)$)      { return 301 https://media.gloat.ing/q3/df/$1; }
           }
           location ^~ /void/salon/   { if ($request_uri ~ ^/void/(salon/.*)$)   { return 301 https://media.gloat.ing/$1; } }
           location ^~ /void/mckenna/ { if ($request_uri ~ ^/void/(mckenna/.*)$) { return 301 https://media.gloat.ing/$1; } }
           location ^~ /void/txt/     { if ($request_uri ~ ^/void/(txt/.*)$)     { return 301 https://media.gloat.ing/$1; } }
           location ^~ /void/poe/     { if ($request_uri ~ ^/void/(poe/.*)$)     { return 301 https://media.gloat.ing/$1; } }
           location = /void/df      { return 301 https://media.gloat.ing/q3/df/; }
           location = /void/salon   { return 301 https://media.gloat.ing/salon/; }
           location = /void/mckenna { return 301 https://media.gloat.ing/mckenna/; }
           location = /void/txt     { return 301 https://media.gloat.ing/txt/; }
           location = /void/poe     { return 301 https://media.gloat.ing/poe/; }
           location = "/void/TimeWaveZero - Fractal Time v.7.10.zip" { return 301 "https://media.gloat.ing/mckenna/TimeWaveZero%20-%20Fractal%20Time%20v.7.10.zip"; }
           location = /void/        { return 301 https://media.gloat.ing/; }

           #location /void/logos/ {
            #auth_basic "Restricted Access";
           # auth_basic off;
            #root /usr/share/nginx/html;
            #auth_basic_user_file /etc/nginx/logos/.htpasswd;}
           #index index.html;}
