location = /void/sysinfo {
    access_by_lua_block { if not require("void_auth").check() then return ngx.exit(403) end }
    limit_req zone=site burst=20 nodelay;
    default_type application/json;
    alias /var/lib/voidbot-pub/sysinfo.json;
    more_set_headers "Cache-Control: no-store";}
location = /void/stall {
    limit_req zone=stall burst=10 nodelay;
    client_max_body_size 1k;
    set $stall_line "";
    access_log /var/log/openresty/stall.log stall if=$stall_line;   # only accepted reports
    content_by_lua_block {
        if ngx.req.get_method() ~= "POST" then return ngx.exit(405) end
        ngx.req.read_body()
        local a = ngx.req.get_post_args(8) or {}
        local k = type(a.k) == "string" and a.k or ""
        -- an R2 media key: known top folder, no control characters (tabs/newlines would break the log)
        if #k > 300 or k:find("%c") or not (k:find("^q3/") or k:find("^bbx/") or k:find("^poe/") or k:find("^public/")) then
            return ngx.exit(400)
        end
        local function num(v, max)
            local n = tonumber(v)
            return (n and n >= 0 and n <= max) and tostring(n) or "-"
        end
        ngx.var.stall_line = table.concat({ k, num(a.t, 1e6), num(a.mbps, 1e5), num(a.ahead, 1e5), num(a.kbps, 1e7) }, "\t")
        return ngx.exit(204)
    }
}
location = /void.html { return 301 /; }
location = /void/login {
                limit_req zone=login burst=5 nodelay;   # 1 r/s per IP + 5 quick retries (status 429)
                default_type text/html;
                content_by_lua_block {
                    local auth = require "void_auth"
                    local h = ngx.req.get_headers()
                    -- index.js (and later the player's passphrase box) ask for JSON;
                    -- a plain form post gets the old redirect/text answers
                    local wants_json = h["X-Requested-With"] == "XMLHttpRequest"
                        or string.find(h["Accept"] or "", "application/json", 1, true) ~= nil

                    local function reply(status, json, text)
                        ngx.status = status
                        ngx.header["Cache-Control"] = "no-store"
                        if wants_json then
                            ngx.header["Content-Type"] = "application/json"
                            ngx.say(json)
                        else
                            ngx.say(text)
                        end
                    end

                    if ngx.req.get_method() == "POST" then
                        ngx.req.read_body()
                        local args = ngx.req.get_post_args()
                        if args and auth.validate(args.password) then
                            auth.set_cookie()
                            if wants_json then
                                return reply(200, '{"status":"ok"}')
                            end
                            return ngx.redirect("/")
                        end
                        return reply(401, '{"status":"error","message":"Invalid passphrase"}', "Wrong passphrase")
                    end

                    -- GET: plain form (gatekeeper backdoor / no-JS fallback)
                    ngx.header["Cache-Control"] = "no-store"
                    ngx.say([[<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatekeeper</title><link rel="stylesheet" href="/css/login-fallback.css"></head>
<body><form method="POST">
<input type="password" name="password" placeholder="Passphrase" autocomplete="current-password" autofocus>
<button type="submit">Enter</button>
</form></body></html>]])
                }
            }

            location = /void/logout {
                            limit_req zone=login burst=5 nodelay;
                            default_type application/json;
                            content_by_lua_block {
                                if ngx.req.get_method() ~= "POST" then
                                    return ngx.exit(405)
                                end
                                require("void_auth").clear_cookies()
                                ngx.header["Cache-Control"] = "no-store"
                                ngx.say('{"status":"ok"}')
                            }
                        }

