# Bans scanners probing for software this server doesn't run (jail: maxretry = 1, bantime = 1w).
# Safety rules (2026-10-06):
#  - Only FAILED requests count: the status after the request must be 400/403/404/405/444
#    (OpenResty maps 404 and 5xx to 444). A file that exists (200/206/304) can never ban anyone,
#    so a visitor loading /lib.woff2, /script.js, /services/... is safe.
#  - Unmistakable probe words (php*, cgi*, *myadmin, joomla, ...) match at the start of any path segment.
#    Ordinary words that could be a real file name (lib, script, config, service, ...) must be the whole
#    FIRST path segment: followed by / ? a probe extension or the end of the path
#    (so /lib.woff2 would not match even if it ever 404'd; /lib/ and /lib.php would).
#  - 2026-10-07: added _ignition, actuator, litellm, openai-proxy (secret/debug-endpoint probes).
#  - Path words (1-4) only match inside the request line, not the referer or user agent.
# Note: requests that hit OpenResty's own block locations (.php, dotfiles, wp-login, ...) have
# access_log off, so they never reach this filter; those already get 444.
# Old version: nginx-badstuff.conf.bak-2026-10-06
#
# 1) WordPress probes (no WordPress on this server)
# 2) Scripts / admin panels we don't host (2a: probe words anywhere, 2b: ordinary words as first segment)
# 3) Script extensions we don't host
# 4) Probe paths
# 5) Scanner names and referer spam domains (anywhere in the line, any status: they show up in the user agent / referer)

[Definition]

_fail = (?:400|403|404|405|444)
_req  = ^<HOST> .*? "[A-Z]+ /+
_end  = (?:[/?]|\.(?:php\d?|aspx?|jsp|cgi|pl|sh|sql|bak|old|zip|t?gz|tar|rar|7z|json|xml|ya?ml|ini|env|log|txt|cfg|conf)\b|(?= HTTP/))

failregex = (?i)%(_req)s(?:wp-|wp/|xmlrpc\.php|\?author=1)[^"]*" %(_fail)s\b
            (?i)%(_req)s(?:[^" ]*/)?(?:_ignition|a2billing|actuator|cfide|cgi|hnap|jenkins|jmx-|joomla|linuxsucks|litellm|muieblackcat|myadmin|mysql|n0w|openai-proxy|owa-autodiscover|pbxip|php|pma|sqlite|vmskdl44rededd|vtigercrm|w00tw00t|webdav|websql|wordpress|xampp|xxbb)[^"]*" %(_fail)s\b
            (?i)%(_req)s(?:admin|apache|axis|blog|cms|config|etc|inc|lib|msd|recordings|sap|sdk|script|service|shell)%(_end)s[^"]*" %(_fail)s\b
            (?i)%(_req)s[^" ]+\.(?:asp|cgi|exe|jsp|mvc|pl)(?:[ ?][^"]*)?" %(_fail)s\b
            (?i)%(_req)s[^"]*(?:/bash|changelog|servlet|testproxy|uploadify)[^"]*" %(_fail)s\b
            (?i)^<HOST> .*(?:jorgee|masscan|burger-imperia|hundejo|hvd-store|pizza-imperia|pizza-tycoon)

ignoreregex =
